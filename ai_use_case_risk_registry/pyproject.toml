[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "controlledger"
version = "0.1.0"
description = "Versioned AI-system inventory and governance evidence tracker"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Madan Mohan"}]
dependencies = []

[project.scripts]
controlledger = "controlledger.cli:main"

[tool.setuptools.packages.find]
include = ["controlledger*"]

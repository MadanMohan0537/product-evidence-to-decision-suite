name: Catalog consistency
on:
  push:
    paths:
      - 'catalog.json'
      - 'README.md'
      - 'scripts/check-catalog.mjs'
      - 'scripts/generate-catalog.mjs'
      - '.github/workflows/catalog-consistency.yml'
      - '**/README.md'
  pull_request:
    paths:
      - 'catalog.json'
      - 'README.md'
      - 'scripts/check-catalog.mjs'
      - 'scripts/generate-catalog.mjs'
      - '.github/workflows/catalog-consistency.yml'
      - '**/README.md'
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-catalog.mjs

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "synthseal"
version = "0.2.0"
description = "Synthetic data releases with utility evidence and privacy attack ensembles"
requires-python = ">=3.11"
[project.scripts]
synthseal = "synthseal.cli:main"
[tool.setuptools.packages.find]
include = ["synthseal*"]

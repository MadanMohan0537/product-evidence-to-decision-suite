[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "guardrailci"
version = "0.1.0"
description = "Continuous adversarial regression testing for AI applications"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Madan Mohan"}]
dependencies = []

[project.scripts]
guardrailci = "guardrailci.cli:main"

[tool.setuptools.packages.find]
include = ["guardrailci*"]

[tool.setuptools.package-data]
guardrailci = ["data/*.yaml"]

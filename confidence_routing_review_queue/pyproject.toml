[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "queuecal"
version = "0.1.0"
description = "Calibrated confidence routing with reviewer-capacity economics"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Madan Mohan"}]
dependencies = []

[project.scripts]
queuecal = "queuecal.cli:main"

[tool.setuptools.packages.find]
include = ["queuecal*"]

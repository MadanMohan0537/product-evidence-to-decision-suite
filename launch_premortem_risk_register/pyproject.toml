[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskcouncil"
version = "0.1.0"
description = "Structured multi-perspective launch premortems"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Madan Mohan"}]
dependencies = []

[project.scripts]
riskcouncil = "riskcouncil.cli:main"

[tool.setuptools.packages.find]
include = ["riskcouncil*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "schemapact"
version = "0.1.0"
description = "Producer-owned data contracts with consumer impact previews"
requires-python = ">=3.11"
[project.scripts]
schemapact = "schemapact.cli:main"
[tool.setuptools.packages.find]
include = ["schemapact*"]
